spring.application.name=SmartPay-BackEnd


# h2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# db config
spring.datasource.url=jdbc:h2:mem:smartpayDB
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# spring security (default, to be removed later)
spring.security.user.name=admin
spring.security.user.password=admin

# email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=smartpay.fdmgroup@gmail.com
# Ask Amelia for the mail password
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#actuator for dev
management.endpoints.web.exposure.include=health,info,metrics,env,beans,mappings,loggers
management.endpoint.health.show-details=always
management.metrics.enable.all=true

# jwt security (dev said it was fine to have a secret here for now)
jwt.secret=smartpay-demo-secret-key-1234567890-abcdefghij
jwt.expirationSeconds=3600
